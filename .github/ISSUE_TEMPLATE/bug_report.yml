name: Bug Report
description: Report something that does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        Before you start, please search the [existing issues](https://github.com/mesutpiskin/keycloak-2fa-email-authenticator/issues) and check the [troubleshooting guide](https://mesutpiskin.github.io/keycloak-2fa-email-authenticator/troubleshooting).

        **Do not report security vulnerabilities here.** Follow [SECURITY.md](https://github.com/mesutpiskin/keycloak-2fa-email-authenticator/blob/main/SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem? Include the authentication flow setup if relevant.
      placeholder: |
        1. Add "Email OTP" to a copy of the browser flow as ...
        2. Configure the authenticator with ...
        3. Log in as a user with ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The full version of the JAR you installed.
      placeholder: 26.7.2-KC26.7.3
    validations:
      required: true

  - type: input
    id: keycloak-version
    attributes:
      label: Keycloak version
      placeholder: "26.7.3"
    validations:
      required: true

  - type: dropdown
    id: authenticator
    attributes:
      label: Authenticator
      options:
        - Email OTP
        - Conditional Email OTP
        - Email OTP (No Enrollment)
        - Set up Email Authenticator (required action)
        - Not authenticator specific
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Email provider
      options:
        - Keycloak SMTP
        - SendGrid
        - AWS SES
        - Mailgun
        - Not provider specific
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Keycloak distribution (providers/ directory)
        - Docker / container image
        - Kubernetes / Keycloak Operator
        - Other
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Authenticator configuration
      description: Relevant settings, such as `emailProviderType`, `enableFallback`, `length`, `ttl`, `maxAttempts`, and `simulationMode`. **Remove all API keys and secrets.**
      render: properties

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant Keycloak server logs or stack traces. **Remove credentials, OTP codes, email addresses, and other personal data.**
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that may help, such as screenshots, a custom login or email theme, or other installed providers.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues and this bug has not been reported yet.
          required: true
        - label: I ran `kc.sh build` after installing the plugin JAR (not needed for `start-dev`).
        - label: I removed credentials and personal data from this report.
          required: true
