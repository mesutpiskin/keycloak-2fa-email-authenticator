name: Feature Request
description: Suggest a new feature, email provider, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please search the [existing issues](https://github.com/mesutpiskin/keycloak-2fa-email-authenticator/issues) first to avoid duplicates.

  - type: dropdown
    id: type
    attributes:
      label: Type of request
      options:
        - New email provider
        - Authenticator or OTP behavior
        - Enrollment (required action)
        - Configuration option
        - Login page, email template, or translation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Describe your use case.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work? For a new email provider, link its API documentation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have considered, such as sending through Keycloak SMTP or customizing the theme.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that may help, such as screenshots or links.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to submit a pull request for this feature.
