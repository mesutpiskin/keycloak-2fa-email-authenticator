# Step 2 of a release. Runs when a release/v<version> PR opened by
# prepare-release.yml is merged: tags v<version>, creates the GitHub Release,
# then runs publish.yml to build and publish the jars for the last 10 Keycloak
# releases.
#
# Requires secrets (used by publish.yml): CENTRAL_TOKEN_USERNAME,
#   CENTRAL_TOKEN_PASSWORD, GPG_SIGNING_KEY, GPG_SIGNING_KEY_PASSWORD
# Optional secret: RELEASE_TOKEN, used to create the release if set.

name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  tag-release:
    name: Tag and create GitHub release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # The branch name alone isn't proof this PR came from prepare-release.yml.
      # Requiring the merged pom.xml to be at the version the branch name
      # claims guards against a coincidentally-named branch.
      - name: Verify this is a real release PR
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          EXPECTED="${HEAD_REF#release/v}"
          ACTUAL=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Branch '$HEAD_REF' claims version $EXPECTED but pom.xml at the merge commit is $ACTUAL — refusing to tag/publish."
            exit 1
          fi

      # gh release create tags at --target itself, so there is no separate
      # tag push to keep in sync with the release.
      - name: Create tag and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          TAG="${HEAD_REF#release/}"

          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Released $TAG." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: tag-release
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag-release.outputs.tag }}
    secrets: inherit
